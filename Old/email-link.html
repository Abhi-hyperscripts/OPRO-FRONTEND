<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opro | Email Link</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="assets/vender/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
    <section class="RegBg d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="FormsContainer">
                <div><img class="d-block m-auto" src="assets/images/logo.png" /></div>
                <div class="heading mt-md-3">Email Link</div>
                <form action="" class="form LoginForm px-md-5">
                    <div class="form-group">
                        <table class="email-link w-100">
                            <tbody>
                                <tr>
                                    <td>Name:</td>
                                    <td>xyz</td>
                                </tr>
                                <tr>
                                    <td>Email Id:</td>
                                    <td>xyz@gmail.com</td>
                                </tr>
                            </tbody>
                           
                        </table>
                    </div>
                    <div class="FormsField">
                        <label class="FormsLabel" for="name">Password</label>
                        <input required="" class="input" type="password" name="Password" id="Password" placeholder="*************">
                    </div>
                    <div class="FormsField">
                        <label class="FormsLabel" for="name">Confirm Password</label>
                        <input required="" class="input" type="password" name="ConfirmPassword" id="ConfirmPassword" placeholder="*************">
                    </div>
                    <div class="row">
                        <div class="col-12 pt-3">
                            <input type="checkbox" />
                            <span class="mx-1 checinfos">I agree all statements in Terms of service</span>
                        </div>
                    </div>
                    <input class="FormsButton" type="submit" value="Registration">
                </form>
            </div>
        </div>
    </section>
</body>
<script src="assets/vender/js/popper.min.js"></script>
<script src="assets/vender/js/bootstrap.min.js"></script>
<script src="demo.js"></script>

</html>
