<script>
    function toggleAccordion(btn) {
        var allContents = document.querySelectorAll('.accordion-content1');
        var allButtons = document.querySelectorAll('.accordion-btn1');
        var content = btn.nextElementSibling;
        var plusIcon = btn.querySelector('.plus');
        var minusIcon = btn.querySelector('.minus');
        
        // Close all accordion items except the one being toggled
        allContents.forEach(function (item, index) {
            if (item !== content) {
                item.style.maxHeight = null;
                item.previousElementSibling.querySelector('.plus').style.display = "inline";
                item.previousElementSibling.querySelector('.minus').style.display = "none";
                item.previousElementSibling.innerHTML = item.previousElementSibling.innerHTML.replace("View Less", "View More");
            }
        });

        if (content.style.maxHeight === "0px" || content.style.maxHeight === "") {
            content.style.maxHeight = content.scrollHeight + "px";
            plusIcon.style.display = "none";
            minusIcon.style.display = "inline";
            btn.innerHTML = btn.innerHTML.replace("View More", "View Less");
        } else {
            content.style.maxHeight = null;
            plusIcon.style.display = "inline";
            minusIcon.style.display = "none";
            btn.innerHTML = btn.innerHTML.replace("View Less", "View More");
        }
    }
</script>
