              <div class="container">
                <div class="row">
                <div class="card-body">
                  <div class="table-responsive daily-table">
                    <table class="table table-bordered arrival-table property-table">
                            <thead>
                                <tr>
                                    <th>Details</th>
                                    <th style="text-align: right;"><span id="CurrentDateTime"></span></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Issued to Dept.</td>
                                    <td>
                                        <select name="" id="issued-to-team" class="form-select" oninput="DepartmentChange()">
                                            <option value="0">Back of the House</option>
                                            <option value="1">BBBB</option>
                                            <option value="2">CCCC</option>
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Issued By</td>
                                    <td>
                                        <!--<select name="" id="issued-by-team" class="form-select" oninput="DepartmentChange()"></select>  -->

                                    </td>
                                </tr>
                                <tr>
                                    <td>Area</td>
                                    <td>
                                        <select name="" id="issued-to-area" class="form-select">
                                            <option value="0">Public Area</option>
                                            <option value="1">BBBB</option>
                                            <option value="2">CCCC</option>
                                            <option value="3">Other</option>
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Sub-Area</td>
                                    <td>
                                      <input class="form-control" type="text" name="Subarea" id="Subarea" placeholder="Subarea">
                                  </td>
                                </tr>
                                <tr>
                                    <td>Job Details</td>
                                    <td>
                                        <input class="form-control" type="text" name="job-details" id="job-details" placeholder="Enter job detail ">
                                    </td>
                                </tr>
                                <tr  id="deptAssignRow">
                                    <td>Assign (Dept.)</td>
                                    <td>
                                        <select name="" id="TeamAssignRow" class="form-select" oninput="SubTeamChange()">
                                           
                                        </select>
                                    </td>
                                </tr>
                                <tr id="supervisorAssignRow">
                                    <td>Assign (Supervisor)</td>
                                    <td>
                                        <select name="" id="supervisorAssigndto" class="form-select">
                                            
                                        </select>
                                      </td>
                                </tr>
                                <tr>
                                    <td>Photo</td>
                                    <td>
                                      <div class="upload">
                                          <label class="upload-area">
                                            <input id="job-photo" type="file" accept=".jpeg, .jpg, .mp4, .mov">
                                            <span class="upload-button">
                                              <i class="fas fa-upload"></i>
                                            </span>
                                          </label>
                                        </div>
                                    </td>
                                </tr>
                </tbody>
                        </table>
