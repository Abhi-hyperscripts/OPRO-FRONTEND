<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opro | Forgot Password</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="assets/vender/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>
    <section class="FormsBg d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="FormsContainer">
                <div>
                    <a href="index.html">
                    <img class="d-block m-auto" src="assets/images/logo.png" />
                    </a>
                    </div>
                <div class="heading mt-md-1">Forgot Password</div>
                <p class="text-center forgotContent">Enter your email and we'll send you a link to reset your password.</p>
                <form action="" class="form LoginForm px-md-5">
                    <div class="FormsField">
                        <label class="FormsLabel" for="name">Email id/Mobile No.</label>
                        <input required="" class="input" type="number" name="mobile" id="mobile" placeholder="Email id/Mobile No.">
                    </div>
                    <div class="FormsField">
                        <label class="FormsLabel" for="name">OTP</label>
                        <input required="" class="input" type="number" name="otp" id="otp" placeholder="Enter Otp">
                    </div>
                    <div class="FormsField" style="text-align: end;">
                        <a href="#" >Resend Otp</a>
                    </div>
                    <input class="FormsButton" type="submit" value="Submit">
                </form>
                <span class="agreement pb-md-5"><i class="fa-solid fa-chevron-left"></i> Back<a href="Login.html"> Log In</a></span>
            </div>
        </div>
    </section>
</body>
<script src="assets/vender/js/popper.min.js"></script>
<script src="assets/vender/js/bootstrap.min.js"></script>
<script src="demo.js"></script>

</html>
