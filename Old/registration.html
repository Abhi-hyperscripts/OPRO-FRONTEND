<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opro | Registration</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="assets/vender/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
    <section class="RegBg d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="FormsContainer">
                <div>
                    <a href="index.html">
                    <img class="d-block m-auto" src="assets/images/logo.png" />
                    </a>
                </div>
                <div class="heading mt-md-3">Registration</div>
                <form action="" class="form LoginForm px-md-5">
                    <div class="FormsField">
                        <label class="FormsLabel" for="name">Full Name</label>
                        <input required="" class="input" type="text" name="name" id="name" placeholder="Full Name">
                    </div>
                    <div class="FormsField">
                        <label class="FormsLabel" for="name">Email ID</label>
                        <input required="" class="input" type="email" name="email" id="email" placeholder="Email ID...">
                    </div>
                    <div class="FormsField">
                        <label class="FormsLabel" for="name">Mobile Number</label>
                        <input required="" class="input" type="number" name="mobile" id="mobile" placeholder="Mobile Number">
                    </div>
                    <div class="FormsField">
                        <label class="FormsLabel" for="name">OTP</label>
                        <input required="" class="input" type="number" name="otp" id="otp" placeholder="Enter Otp">
                    </div>
                    <div class="FormsField" style="text-align: end;">
                        <a href="#" >Resend Otp</a>
                    </div>
                    <div class="FormsField">
                        <label class="FormsLabel" for="name">Password</label>
                        <input required="" class="input" type="password" name="Password" id="Password" placeholder="*************">
                    </div>
                    <div class="row">
                        <div class="col-12 pt-3">
                            <input type="checkbox" /><span class="mx-1">I agree all statements in Terms of service</span>
                        </div>
                    </div>
                    <input class="FormsButton" type="submit" value="Registration">
                </form>
                <span class="agreement">Already have an account<a href="login.html"> Login</a></span>
            </div>
        </div>
    </section>
</body>
<script src="assets/vender/js/popper.min.js"></script>
<script src="assets/vender/js/bootstrap.min.js"></script>
<script src="demo.js"></script>

</html>
