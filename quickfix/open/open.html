<!-- Mobile Design -->

  <input class="form-control" type="text" name="Search" id="Search" placeholder="Search" oninput="SearchOpenJobs()">
  <div class="accordion1" id="open-card-view">
  </div>
</div>

<!-- Desktop Design -->
<div class="card-body py-2">
  <div class="table- " >
    <table id="openjobstable" class="table table-sm table-hover "
      style="font-size: 12px; width:100%; text-align: initial;" cellspacing="0">


      <thead class="scf" >
        <tr>
          <th>Sr.No.</th>
          <th>Job Details</th>
          <th>Issued By</th>
          <th>Issued To</th>
          <th>Area</th>
          <th>Sub-Area</th>
          <th >Open Date/Time</th>
          <th>Photo Before</th>
          <th>Assign Sub-Dept.</th>
          <th>Assign Name</th>
          <th>Photo After</th>
          <th>Status</th>
          <th>Remarks</th>
          <th class="w-px-300">Action</th>
        </tr>
      </thead>
      <tbody id="open-table-view">
      </tbody>

<style>
  
#openjobstable th, 
#openjobstable td {
    width: 160px !important;
    min-width: 140px !important;
    max-width: 180px !important;
    white-space: normal !important;  
    overflow: hidden;
    text-overflow: ellipsis;
}
#openjobstable thead th select {
    width: 100% !important;          
    max-width: 140px !important;      
       
  
  
  
}
</style>



    </table>
